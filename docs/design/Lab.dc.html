<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PokerLab equity lab</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#18181b}a:hover{color:#52525b}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #ffffff; color: #09090b; font-family: Geist, Inter, system-ui, sans-serif; display: flex; flex-direction: column;">
  <div style="flex-grow: 1; padding: 64px 24px 24px; display: flex; flex-direction: column; gap: 28px;">
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <h1 style="margin: 0; font-size: 28px; font-weight: 600; letter-spacing: -0.02em;">Lab</h1>
      <button type="button" style="height: 36px; padding: 0 12px; border: 1px solid #e4e4e7; border-radius: 8px; background: #ffffff; color: #09090b; font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 6px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#09090b" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"></path></svg>Reset</button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 12px;">
      <div style="border: 1px solid #e4e4e7; border-radius: 12px; padding: 16px 20px; display: flex; align-items: center; gap: 16px;">
        <div style="display: flex; gap: 6px;">
          <sc-for list="{{hero}}" as="c" hint-placeholder-count="2">
            <div style="width: 40px; height: 56px; box-sizing: border-box; border: 1px solid #e4e4e7; border-radius: 7px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;">
              <span style="font-size: 17px; font-weight: 600; line-height: 1; color: {{c.color}};">{{c.rank}}</span>
              <span style="font-size: 14px; line-height: 1; color: {{c.color}};">{{c.suit}}</span>
            </div>
          </sc-for>
        </div>
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
          <span style="font-size: 13px; color: #71717a;">You</span>
          <span style="font-size: 15px; font-weight: 500;">Ace-king suited</span>
        </div>
        <span style="font-size: 28px; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums;">46.0%</span>
      </div>
      <div style="border: 1px solid #e4e4e7; border-radius: 12px; padding: 16px 20px; display: flex; align-items: center; gap: 16px;">
        <div style="display: flex; gap: 6px;">
          <sc-for list="{{villain}}" as="c" hint-placeholder-count="2">
            <div style="width: 40px; height: 56px; box-sizing: border-box; border: 1px solid #e4e4e7; border-radius: 7px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;">
              <span style="font-size: 17px; font-weight: 600; line-height: 1; color: {{c.color}};">{{c.rank}}</span>
              <span style="font-size: 14px; line-height: 1; color: {{c.color}};">{{c.suit}}</span>
            </div>
          </sc-for>
        </div>
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
          <span style="font-size: 13px; color: #71717a;">Villain</span>
          <span style="font-size: 15px; font-weight: 500;">Pocket queens</span>
        </div>
        <span style="font-size: 28px; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; color: #71717a;">53.6%</span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px;">
      <div style="display: flex; height: 8px; border-radius: 999px; overflow: hidden; gap: 2px;">
        <div style="width: 46%; background: #09090b;"></div>
        <div style="width: 0.4%; background: #d4d4d8;"></div>
        <div style="flex-grow: 1; background: #e4e4e7;"></div>
      </div>
      <div style="display: flex; justify-content: space-between; font-size: 12px; color: #71717a;">
        <span>Win 46.0%</span><span>Tie 0.4%</span><span>Lose 53.6%</span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 12px;">
      <span style="font-size: 13px; color: #71717a;">Board</span>
      <div style="display: flex; gap: 8px;">
        <sc-for list="{{slots}}" as="s" hint-placeholder-count="5">
          <button type="button" aria-label="Add board card" style="width: 56px; height: 76px; box-sizing: border-box; border: 1px dashed #d4d4d8; border-radius: 8px; background: #ffffff; display: flex; align-items: center; justify-content: center; cursor: pointer;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a1a1aa" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
          </button>
        </sc-for>
      </div>
    </div>

    <div style="border: 1px solid #e4e4e7; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 14px;">
      <div style="display: flex; align-items: baseline; justify-content: space-between;">
        <span style="font-size: 15px; font-weight: 500;">Convergence</span>
        <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; color: #71717a;">1.71M boards · exact</span>
      </div>
      <svg viewBox="0 0 302 96" width="302" height="96" role="img" aria-label="Equity estimate settling at 46 percent as trials increase">
        <line x1="0" y1="52" x2="302" y2="52" stroke="#e4e4e7" stroke-dasharray="3 3"></line>
        <path d="M0 18 L20 70 L40 34 L60 62 L80 44 L100 57 L120 48 L140 55 L160 50 L180 53 L200 51 L220 52.5 L240 51.6 L260 52.2 L280 51.9 L302 52" fill="none" stroke="#09090b" stroke-width="1.5" stroke-linejoin="round"></path>
      </svg>
      <div style="display: flex; justify-content: space-between; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11px; color: #a1a1aa;">
        <span>0</span><span>4.9 ms</span>
      </div>
    </div>
  </div>

  <nav aria-label="Main" style="display: flex; justify-content: space-around; padding: 12px 8px 32px; border-top: 1px solid #f4f4f5;">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 64px; font-size: 11px; font-weight: 500; color: #a1a1aa; text-decoration: none;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#a1a1aa" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19V5l8 4 8-4v14l-8 4-8-4z"></path></svg>Learn</a>
    <a href="Lab.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 64px; font-size: 11px; font-weight: 500; color: #09090b; text-decoration: none;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#09090b" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.8 3h10.4a2 2 0 0 0 1.8-3l-5-9V3"></path></svg>Lab</a>
    <a href="Lesson.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 64px; font-size: 11px; font-weight: 500; color: #a1a1aa; text-decoration: none;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#a1a1aa" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="5"></circle><circle cx="12" cy="12" r="1"></circle></svg>Practice</a>
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 64px; font-size: 11px; font-weight: 500; color: #a1a1aa; text-decoration: none;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#a1a1aa" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>Profile</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const ink = '#09090b', red = '#b91c1c';
    return {
      hero: [{ rank: 'A', suit: '♠︎', color: ink }, { rank: 'K', suit: '♠︎', color: ink }],
      villain: [{ rank: 'Q', suit: '♥︎', color: red }, { rank: 'Q', suit: '♦︎', color: red }],
      slots: [1, 2, 3, 4, 5]
    };
  }
}
</script>
</body>
</html>
